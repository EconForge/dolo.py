[project]
site_name = "Dolo"
site_description = "A Python toolkit for modeling, solving, and simulating economic models"
site_author = "EconForge & Pablo Winant"
copyright = "Copyright &copy; 2026 EconForge"

extra_css = [
  "stylesheets/extra.css",
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Install" = "installation.md" },
  { "Modeling" = [
      "modeling_language.md",
      "model_api.md",
      "model_specification.md",
      "processes.md",
  ]},
  { "Model Representation (WIP)" = [
      "model_representation.md",
  ]},
  { "Local Solution Algorithms" = [
      "steady_state.md",
      "perturbation.md",
  ]},
  { "Perfect Foresight Algorithm" = [
      "perfect_foresight.md",
  ]},
  { "Global Solution Algorithms" = [
      "parameterized_expectations.md",
      "time_iteration.md",
      "value_iteration.md",
      "engines.md",
  ]},
  { "Post Processing" = [
      "inspect.md",
      "simulation.md",
  ]},
  { "Misc" = [
      "finite_iteration.md",
  ]},
  { "API Reference" = [
      "api.md",
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
